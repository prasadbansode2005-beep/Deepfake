<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - TrustAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="settings-container">
        <nav class="navbar">
            <div class="navbar-brand">
                <div class="logo-icon">🛡️</div>
                <span>TrustAI</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="detect.html" class="nav-link">Detect</a>
                <a href="history.html" class="nav-link">History</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <button id="logoutBtn" class="btn btn-text">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>Loading settings...</p>
            </div>

            <div id="settingsContent" class="settings-content hidden">
                <div class="settings-header">
                    <h1>User Preferences</h1>
                </div>

                <form id="settingsForm" class="settings-form">
                    <div class="settings-section">
                        <h2>Display & Language</h2>

                        <div class="form-group">
                            <label for="language">Language</label>
                            <select id="language" name="language">
                                <option value="en">English</option>
                                <option value="es">Spanish</option>
                                <option value="fr">French</option>
                                <option value="de">German</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="timezone">Timezone</label>
                            <select id="timezone" name="timezone">
                                <option value="UTC">UTC</option>
                                <option value="EST">Eastern Standard Time</option>
                                <option value="CST">Central Standard Time</option>
                                <option value="MST">Mountain Standard Time</option>
                                <option value="PST">Pacific Standard Time</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="darkMode" name="darkMode">
                                <span>Dark Mode</span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-section">
                        <h2>Notifications</h2>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="emailNotifications" name="emailNotifications">
                                <span>Email Notifications</span>
                            </label>
                            <p class="hint">Receive email updates about your scans and account activity</p>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="scanAlerts" name="scanAlerts">
                                <span>Scan Alerts</span>
                            </label>
                            <p class="hint">Get notified when analysis is complete</p>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        }

        async function loadSettings() {
            try {
                const response = await getSettings();

                if (response.success && response.data) {
                    const settings = response.data;

                    document.getElementById('language').value = settings.language || 'en';
                    document.getElementById('timezone').value = settings.timezone || 'UTC';
                    document.getElementById('darkMode').checked = settings.darkMode ?? true;
                    document.getElementById('emailNotifications').checked = settings.emailNotifications ?? true;
                    document.getElementById('scanAlerts').checked = settings.scanAlerts ?? true;

                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('settingsContent').classList.remove('hidden');
                } else {
                    showToast('Failed to load settings', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error loading settings', 'error');
            }
        }

        document.getElementById('settingsForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const response = await updateSettings(
                    document.getElementById('language').value,
                    document.getElementById('timezone').value,
                    document.getElementById('emailNotifications').checked,
                    document.getElementById('scanAlerts').checked,
                    document.getElementById('darkMode').checked
                );

                if (response.success) {
                    showToast('Settings saved successfully', 'success');
                } else {
                    showToast(response.message || 'Save failed', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error saving settings', 'error');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await logout();
            } finally {
                window.location.href = 'login.html';
            }
        });

        loadSettings();
    </script>
</body>
</html>
