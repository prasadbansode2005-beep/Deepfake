<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustAI | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-panel">
      <div class="auth-header">
        <div class="brand" aria-label="TrustAI logo">
          <span class="brand-mark"></span>
          <span>TrustAI</span>
        </div>
        <h1 class="auth-heading">Welcome Back!</h1>
        <p class="auth-subtitle">Sign in to continue</p>
      </div>

      <form id="loginForm" class="form-grid" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <div class="input-wrap">
            <input id="loginEmail" class="form-control" type="email" placeholder="Enter your email" />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <input id="loginPassword" class="form-control" type="password" placeholder="Enter your password" />
            <button type="button" class="password-toggle">Show</button>
          </div>
        </div>

        <div class="form-row">
          <label class="check-wrap">
            <input id="rememberMe" type="checkbox" class="checkbox" />
            <span>Remember Me</span>
          </label>
          <a href="#" class="link-text">Forgot Password?</a>
        </div>

        <button class="btn btn-primary auth-btn" type="submit">Login</button>
      </form>

      <div class="auth-divider">or continue with</div>

      <button class="btn google-btn" type="button">
        <span class="google-mark"></span>
        Google
      </button>

      <div class="auth-footer">
        Don’t have an account? <a href="register.html" class="link-text">Register</a>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
